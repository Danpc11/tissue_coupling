name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy
      - name: Check every script parses
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          bad = []
          for p in pathlib.Path(".").rglob("*.py"):
              try:
                  ast.parse(p.read_text())
              except SyntaxError as e:
                  bad.append(f"{p}: {e}")
          print("\n".join(bad) if bad else "all scripts parse")
          sys.exit(1 if bad else 0)
          PY
      - name: Check the orchestrator
        run: bash -n run_all.sh
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: Every input has a producer that runs earlier
        run: python tests/verify_inputs.py
      - name: No gene set outside the registry
        run: python tests/test_gene_lists.py
      - name: Phase-coherence statistic on simulated phases
        run: python tests/test_phase_statistic.py
      - name: The phase-template validation uses nothing from the held-out subject
        run: python tests/test_phase_template.py
      - name: A single sample is scored against a fixed reference
        run: python tests/test_single_sample.py
      - name: The estimator finds no effect where the model has none
        run: python tests/test_model_null.py
      - name: The verdict on competing models tells positive, negative and zero apart
        run: python tests/test_model_verdict.py
      - name: Integration test of step 14b on a simulated series
        run: python tests/test_clamp_vs_saline.py
